<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#090a08" />
    <meta name="description" content="原创复古 3D 坦克守卫战单页游戏" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22><rect width=%2232%22 height=%2232%22 rx=%224%22 fill=%22%23151710%22/><path d=%22M5 12h22v13H5zM9 7h14v6H9zm6-5h2v7h-2z%22 fill=%22%23ffca55%22/></svg>" />
    <title>钢铁堡垒 1985</title>
  </head>
  <body>
    <main id="app">
      <canvas id="game-canvas" aria-label="钢铁堡垒 1985 可玩游戏画面"></canvas>
      <div class="screen-vignette" aria-hidden="true"></div>
      <div class="scanlines" aria-hidden="true"></div>

      <header id="topbar">
        <section class="hud-cluster hud-left" aria-label="玩家状态">
          <span class="hud-kicker">1P</span>
          <div id="life-pips" class="life-pips" aria-label="剩余生命"></div>
          <span class="base-state"><i id="base-light"></i> BASE</span>
        </section>
        <section class="title-lockup" aria-label="游戏标题">
          <span>IRON BASTION</span>
          <strong>1985</strong>
        </section>
        <section class="hud-cluster hud-right" aria-label="战场进度">
          <div><span class="hud-kicker">LEVEL / WAVE</span><b><span id="level-value">01</span>-<span id="wave-value">01</span></b></div>
          <div><span class="hud-kicker">ENEMY</span><b><span id="kills-value">00</span>/<span id="target-value">12</span></b></div>
          <button id="pause-button" type="button" aria-label="暂停游戏">Ⅱ</button>
        </section>
      </header>

      <aside id="mission-strip" aria-live="polite">
        <span id="status-icon">◆</span>
        <span id="status-line">守住雄鹰基地 · 消灭全部敌军</span>
      </aside>

      <section id="powerup-hud" aria-label="增益状态">
        <div id="shield-meter" class="power-chip"><span>盾</span><i></i></div>
        <div id="rapid-meter" class="power-chip"><span>速</span><i></i></div>
      </section>

      <section id="game-modal" class="modal is-hidden" role="dialog" aria-modal="true">
        <div class="modal-frame">
          <span class="modal-eyebrow" id="modal-eyebrow">MISSION STATUS</span>
          <h1 id="modal-title">暂停</h1>
          <p id="modal-copy">战场已冻结</p>
          <button id="modal-action" type="button">继续作战</button>
          <small id="modal-hint">P 暂停 · R 重开</small>
        </div>
      </section>

      <div id="touch-controls" aria-label="触屏控制">
        <div id="touch-stick" aria-label="移动摇杆">
          <span class="stick-mark north">▲</span><span class="stick-mark east">▶</span>
          <span class="stick-mark south">▼</span><span class="stick-mark west">◀</span>
          <div id="touch-knob"></div>
        </div>
        <button id="fire-button" type="button" aria-label="开火"><span>FIRE</span><b>A</b></button>
      </div>

      <footer id="controls-hint">
        <span><kbd>WASD</kbd> / <kbd>方向键</kbd> 移动</span>
        <span><kbd>SPACE</kbd> 开火</span>
        <span><kbd>P</kbd> 暂停</span>
        <span><kbd>R</kbd> 重开</span>
      </footer>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
