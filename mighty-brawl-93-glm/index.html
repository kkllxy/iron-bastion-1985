<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0c0612" />
    <meta name="description" content="MIGHTY BRAWL — 原创Q版3D清版动作游戏" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22><rect width=%2232%22 height=%2232%22 rx=%225%22 fill=%22%23160a26%22/><text x=%2216%22 y=%2223%22 font-size=%2218%22 text-anchor=%22middle%22 fill=%22%23ff3ea5%22 font-family=%22Arial%22 font-weight=%22bold%22>M</text></svg>" />
    <title>MIGHTY BRAWL · 霓虹快打</title>
  </head>
  <body>
    <main id="app">
      <canvas id="game-canvas" aria-label="MIGHTY BRAWL 可玩游戏画面"></canvas>
      <div class="screen-vignette" aria-hidden="true"></div>
      <div class="scanlines" aria-hidden="true"></div>
      <div id="flash-overlay" aria-hidden="true"></div>
      <div id="hit-layer" aria-hidden="true"></div>

      <header id="topbar">
        <section class="hud-col hud-left" aria-label="玩家状态">
          <div class="stat-block hp-block">
            <span class="hud-kicker">HP</span>
            <div class="meter"><i id="hp-fill"></i><b id="hp-text">100</b></div>
          </div>
          <div class="stat-block">
            <span class="hud-kicker">LIVES</span>
            <div id="life-pips" class="life-pips" aria-label="剩余生命"></div>
          </div>
          <div id="weapon-chip" class="weapon-chip"><span>⚔ 武器</span></div>
        </section>

        <section class="hud-col hud-mid" aria-label="关卡进度">
          <div class="stat-block">
            <span class="hud-kicker">SCORE</span>
            <b id="score-value" class="mono">000000</b>
          </div>
          <div class="zone-block">
            <div class="zone-head"><span id="level-name">霓虹街区</span> <b id="zone-text" class="mono">ZONE 1/3</b></div>
            <div class="meter thin"><i id="zone-fill"></i></div>
          </div>
          <div class="stat-block">
            <span class="hud-kicker">LV</span>
            <b id="level-value" class="mono">LV.1</b>
            <div class="meter thin xp"><i id="xp-fill"></i></div>
          </div>
        </section>

        <section class="hud-col hud-right" aria-label="战斗状态">
          <div class="stat-block rage-block">
            <span class="hud-kicker">RAGE 必杀</span>
            <div class="meter rage"><i id="rage-fill"></i><b id="rage-text" class="mono">0%</b></div>
          </div>
          <button id="pause-button" type="button" aria-label="暂停">II</button>
          <button id="mute-button" type="button" aria-label="静音切换">🔊</button>
        </section>
      </header>

      <div id="combo" class="combo" aria-live="polite"></div>

      <section id="boss-bar" aria-label="关底BOSS血条">
        <span id="boss-name">BOSS</span>
        <div class="meter boss"><i id="boss-fill"></i></div>
      </section>

      <aside id="mission-strip" aria-live="polite">
        <span id="status-icon">◆</span>
        <span id="status-line">清剿黑帮 · 推进关卡</span>
      </aside>

      <section id="game-modal" class="modal" role="dialog" aria-modal="true">
        <div class="modal-frame">
          <span class="modal-eyebrow" id="modal-eyebrow">NEON CITY · 199X</span>
          <h1 id="modal-title">MIGHTY BRAWL</h1>
          <p id="modal-copy">清剿三区黑帮，拯救霓虹之城</p>
          <div class="modal-actions">
            <button id="modal-action" type="button">开始游戏</button>
            <button id="retry-button" type="button" class="secondary">重开本关</button>
          </div>
          <small id="modal-hint">回车 开始 · P 暂停 · R 重开</small>
        </div>
      </section>

      <div id="touch-controls" aria-label="触屏控制">
        <div id="touch-stick" aria-label="移动摇杆">
          <span class="stick-mark north">▲</span><span class="stick-mark east">▶</span>
          <span class="stick-mark south">▼</span><span class="stick-mark west">◀</span>
          <div id="touch-knob"></div>
        </div>
        <div class="touch-actions">
          <button id="grab-button" type="button" aria-label="抓取投掷"><span>抓</span></button>
          <button id="jump-button" type="button" aria-label="跳跃"><span>跳</span></button>
          <button id="special-button" type="button" aria-label="必杀技"><span>必杀</span></button>
          <button id="attack-button" type="button" aria-label="普攻"><span>打</span></button>
        </div>
      </div>

      <footer id="controls-hint">
        <span><kbd>WASD</kbd>/<kbd>方向</kbd> 移动</span>
        <span><kbd>J</kbd>/<kbd>X</kbd> 普攻</span>
        <span><kbd>K</kbd>/<kbd>C</kbd> 跳跃</span>
        <span><kbd>L</kbd>/<kbd>V</kbd> 必杀</span>
        <span><kbd>E</kbd>/<kbd>空格</kbd> 抓取</span>
        <span><kbd>P</kbd> 暂停</span>
      </footer>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
